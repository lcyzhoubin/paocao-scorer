name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Keystore密码（请记住，签名要用）'
        required: true
        default: 'Paocao@2024'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias paocao \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ inputs.password }} \
            -keypass ${{ inputs.password }} \
            -dname "CN=Paocao Scorer, OU=School, O=School, L=Beijing, ST=Beijing, C=CN"

      - name: Print Base64
        run: |
          echo ""
          echo "=================================================="
          echo "请复制下面【两个等号之间】的全部内容（超长字符串）"
          echo "=================================================="
          echo "----BEGIN----"
          base64 -w 0 release.keystore
          echo ""
          echo "----END----"
          echo "=================================================="

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: release.keystore
